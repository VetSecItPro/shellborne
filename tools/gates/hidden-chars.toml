# Characters tools/gates/hidden-chars refuses (plan step P0.11.2). One table serves this gate now and the
# renderer later. Each range is [first, last] as code points, both included.

# Invisible and bidi characters: zero width and direction marks, bidi embeddings and overrides, invisible
# operators, bidi isolates, the byte order mark, the soft hyphen, the Mongolian vowel separator, variation
# selectors, tag characters and the supplementary variation selectors.
ranges = [
    [0x200B, 0x200F],
    [0x202A, 0x202E],
    [0x2060, 0x2064],
    [0x2066, 0x2069],
    [0xFEFF, 0xFEFF],
    [0x00AD, 0x00AD],
    [0x180E, 0x180E],
    [0xFE00, 0xFE0F],
    [0xE0000, 0xE007F],
    [0xE0100, 0xE01EF],
]

# Long dashes: figure dash, en dash, em dash and horizontal bar. Write a hyphen or rewrite the sentence.
dashes = [
    [0x2012, 0x2015],
]

# Suffixes read as binary and never decoded, compared without case. Every other tracked file must be UTF-8.
binary = [".png", ".jpg", ".jpeg", ".gif", ".ico", ".icns", ".tiff", ".webp", ".pdf", ".ttf", ".otf", ".woff",
          ".woff2", ".zip", ".gz", ".car", ".a", ".dylib", ".mov", ".mp4"]

# Fixture files that must hold a listed character, each as an [[allow]] entry with a path and a reason. The path is
# one exact tracked file from the repository root; a folder, a pattern, a wildcard or a file that is not tracked is
# broken, so an entry covers one real file only. There are none yet.
