# Copy tables for tools/gates/copy-lint (plan step P0.11.10). The long-dash rule lives in hidden-chars.toml, so it
# is not repeated here, and the binary suffixes are read from hidden-chars.toml.

# Pitches that claim security, a guard, governance or containment, matched as whole words without case. A plain
# factual word such as "secure" or "sandbox" is not listed; only the pitch is. A factual sentence that trips one is
# allowed by an [[allow]] entry naming the exact file and phrase, with a reason.
forbidden = [
    "security product",
    "security tool",
    "security platform",
    "security layer",
    "security solution",
    "governance product",
    "governance platform",
    "governance layer",
    "governance tool",
    "agent governance",
    "AI governance",
    "secure terminal",
    "secure by default",
    "secure by design",
    "military-grade",
    "bank-grade",
    "enterprise-grade security",
    "unhackable",
    "zero trust",
    "zero-trust",
    "keeps you safe",
    "keeps your agents safe",
    "keeps agents safe",
    "keeps your Mac safe",
    "protects you from",
    "protects your Mac",
    "protects your machine",
    "agent firewall",
    "agent guardrails",
    "guardrails for agents",
    "guardrails for your agents",
    "contains your agents",
    "agent containment",
    "sandboxes your agents",
    "fully sandboxed",
    "isolates your agents",
]

