# Where each kind of code may live (plan steps P0.9.1 and P0.9.2). tools/gates/repo-rules reads this table and
# refuses a match outside the paths a rule allows. Each rule names the build rule it enforces and carries a
# known-bad control line that its own patterns must match, checked on every run. Allowed paths are from the
# repository root: one ending in / is a folder, any other is one exact file. Patterns are regular expressions,
# matched line by line in tracked files with the listed suffixes; spanning patterns are matched across the lines
# of the whole file and carry their own multi-line control. Comments count too, since the gate does not parse
# source.

[[rule]]
id = "timer-or-watcher-outside-core"
enforces = "timers and file watching go through the scheduler and the one event stream"
suffixes = [".swift", ".rs", ".c", ".h", ".m", ".mm", ".cc", ".cpp", ".cxx", ".hpp", ".hh", ".hxx"]
patterns = ['\b(?:NS)?Timer\s*(?:\.init)?\s*\(', '\b(?:NS)?Timer\.(?:scheduledTimer|publish)\w*\b',
            '\bNSTimer\s+(?:scheduledTimer|timer)\w*', '\bDispatchSource\.make(?:Timer|FileSystemObject)Source\b',
            '\bDispatchSourceTimer\b', '\bdispatch_source_create\b', '\bDISPATCH_SOURCE_TYPE_(?:TIMER|VNODE)\b',
            '\b(?:asyncAfter|dispatch_after)\s*\(', '\bafterDelay:', '\bCFRunLoopTimerCreate\w*\b',
            '\bEVFILT_(?:TIMER|VNODE)\b', '\bFSEventStreamCreate\b', '\bNSFilePresenter\b',
            '\bnotify::(?:recommended_watcher|Watcher)\b', '\b(?:Recommended|Poll|Fsevent|FsEvent|Kqueue|Inotify)Watcher\b',
            '\bTask\.sleep\b', '\b\w*[Cc]lock(?:\(\s*\))?\.sleep\s*\(', '\bthread::sleep\b',
            '(?<![\w.:])(?:u|nano)?sleep\s*\(']
allowed = ["crates/sb-core/src/scheduler/", "apple/Sources/CoreClient/Scheduler/", "crates/sb-supervisor/src/event_loop.rs",
           "crates/sb-host/src/event_loop.rs", "crates/sb-vt-worker/src/event_loop.rs"]
control = "let poll = Timer.scheduledTimer(withTimeInterval: 1, repeats: true) { _ in }"

[[rule]]
id = "spawn-outside-scheduler"
enforces = "one scheduler starts every process; the daemon alone spawns session hosts and their PTY"
suffixes = [".swift", ".rs", ".c", ".h", ".m", ".mm", ".cc", ".cpp", ".cxx", ".hpp", ".hh", ".hxx"]
patterns = ['\bCommand::new\b', '\bposix_spawnp?\b', '\bv?fork\s*\(', '\bforkpty\s*\(', '\bexec[lv]p?e?\s*\(',
            '\b(?:system|popen)\s*\(', '\bProcess\s*(?:\.init)?\s*\(\s*\)', '\bProcess\.run\b', '\bNSTask\b']
allowed = ["crates/sb-core/src/scheduler/", "apple/Sources/CoreClient/Scheduler/", "crates/sb-supervisor/src/spawn_host.rs",
           "crates/sb-host/src/pty.rs"]
control = 'let _ = std::process::Command::new("ls");'

[[rule]]
id = "network-outside-update"
enforces = "network-capable code lives only in the update module"
suffixes = [".swift", ".rs", ".c", ".h", ".m", ".mm", ".cc", ".cpp", ".cxx", ".hpp", ".hh", ".hxx"]
patterns = ['\bURLSession\b', '\bstd\s*::\s*(?:\{[^}]*\bnet\b|net\b)', '\bgetaddrinfo\b',
            '^\s*(?:@\w+\s+)*import\s+(?:(?:class|struct|enum|protocol|typealias|func|var|let)\s+)?(?:Network|CFNetwork)\b',
            '#\s*(?:include|import)\s*<(?:Network|CFNetwork)/', '@import\s+(?:Network|CFNetwork)\b']
spanning = ['\bstd\s*::\s*\{[^;]*?\bnet\b']  # a grouped std import split over lines, up to its semicolon
allowed = ["apple/Sources/Update/"]
control = "let s = URLSession.shared"
spanning_control = "use std::{\n    io::{Read, Write},\n    net::TcpStream,\n};"

[[rule]]
id = "engine-outside-adapter"
enforces = "engine symbols appear only in the engine adapter"
suffixes = [".swift", ".rs", ".c", ".h", ".m", ".mm", ".cc", ".cpp", ".cxx", ".hpp", ".hh", ".hxx"]
patterns = ['\bghostty_(?!surface_)\w+']
allowed = ["crates/sb-engine-vt/", "apple/Sources/EngineSurface/"]
control = "unsafe { ghostty_terminal_new(); }"

[[rule]]
id = "surface-outside-terminalview"
enforces = "the surface API appears only in TerminalView"
suffixes = [".swift", ".rs", ".c", ".h", ".m", ".mm", ".cc", ".cpp", ".cxx", ".hpp", ".hh", ".hxx"]
patterns = ['\bghostty_surface_\w+']
allowed = ["apple/Sources/TerminalView/"]
control = "ghostty_surface_new(app, cfg)"

[[rule]]
id = "x86-without-reason"
enforces = "no x86-specific code path without a stated correctness reason"
suffixes = [".swift", ".rs", ".c", ".h", ".cc", ".cpp", ".cxx", ".hpp", ".hh", ".hxx"]
patterns = ['target_arch\s*=\s*"x86(?:_64)?"', '#if\s+arch\(\s*(?:x86_64|i386)\s*\)', '__x86_64__']
allowed = []
reason = "x86-only:"
control = '#[cfg(target_arch = "x86_64")]'

[[rule]]
id = "color-outside-design-system"
enforces = "colors are design-system tokens, defined in DesignSystem only"
suffixes = [".swift"]
patterns = ['"#[0-9A-Fa-f]{6}(?:[0-9A-Fa-f]{2})?"',
            '\b(?:NS|UI|CG)?Color\(\s*(?:\.\w+\s*,\s*)?(?:\w*[Rr]ed|\w*[Ww]hite|\w*[Hh]ue|hex|\w*[Gg]ray)\s*:',
            '\b(?:Color|NSColor|UIColor|CGColor)\.(?:red|orange|yellow|green|mint|teal|cyan|blue|indigo|purple|pink|brown|white|gray|black|clear|magenta|darkGray|lightGray|label|secondaryLabel|tertiaryLabel|quaternaryLabel|system\w+)\b',
            '\.(?:foregroundStyle|foregroundColor|tint|background|fill|stroke|border|accentColor|shadow|overlay)\(\s*(?:\w+\s*:\s*)?\.(?:red|orange|yellow|green|mint|teal|cyan|blue|indigo|purple|pink|brown|white|gray|black|clear)\b']
allowed = ["apple/Sources/DesignSystem/"]
control = 'let tint = Color(hex: "#3A7BD5")'

[[rule]]
id = "spacing-outside-design-system"
enforces = "spacing values are design-system tokens, defined in DesignSystem only"
suffixes = [".swift"]
patterns = ['\.padding\(\s*(?:\.\w+\s*,\s*)?(?:CGFloat\(\s*)?\d', '\bspacing:\s*(?:CGFloat\(\s*)?\d',
            '\.frame\(\s*(?:width|height|minWidth|minHeight|maxWidth|maxHeight):\s*(?:CGFloat\(\s*)?\d',
            '\bNSEdgeInsets\(\s*top:\s*\d']
allowed = ["apple/Sources/DesignSystem/"]
control = "Text(name).padding(12)"

[[rule]]
id = "control-outside-design-system"
enforces = "controls come from the design system, never built raw"
suffixes = [".swift"]
patterns = ['\bNS(?:Button|Slider|Switch|PopUpButton|SegmentedControl|Stepper|ComboBox|TextField|SecureTextField|SearchField|TokenField|ColorWell|DatePicker|PathControl|LevelIndicator|Matrix|TextView)\s*(?:\.init)?\s*\(',
            '\bNSButton\.(?:checkbox|radioButton)WithTitle\b', '\bNSTextField\.(?:label|wrappingLabel)WithString\b',
            '(?<![\w.])(?<!struct )(?<!class )(?<!enum )(?<!extension )(?<!protocol )(?<!actor )(?<!typealias )(?:Button|Toggle|Slider|Stepper|Picker|TextField|SecureField|Menu|ColorPicker|DatePicker|MultiDatePicker|TextEditor|Link|ShareLink|PasteButton|EditButton|RenameButton)\s*[({]']
allowed = ["apple/Sources/DesignSystem/"]
control = 'let ok = NSButton(title: "OK", target: nil, action: nil)'

# Native source the rules above cannot read. A tracked file in one of these languages is refused outside the
# engine adapter, where the pinned engine's own source may be vendored, so no rule is passed by changing language.
# Suffixes are compared without case, here and in every rule.
[languages]
enforces = "native code is written only in languages the source rules read"
unread = [".zig", ".go", ".java", ".kt", ".kts", ".cs", ".d", ".nim", ".odin", ".s", ".asm", ".f90", ".pas", ".ada"]
allowed = ["crates/sb-engine-vt/"]

# The link gate (P0.9.4). libghostty-vt runs only in the per-session vt worker: the supervisor, session
# host, attach client and CLI binaries carry no engine symbol. The GUI's one input view encodes keys with
# libghostty-vt's key encoder, so the GUI may carry that API alone: the encoder and the key events it
# encodes (ghostty_key_encoder_*, ghostty_key_event_*, as the libghostty-vt C headers name them).
[link]
enforces = "the engine runs only in the vt worker; the GUI uses only its key encoder"
engine_prefix = "ghostty_"
daemon_binaries = ["sb-supervisor", "sb-host", "sb-attach", "sb-cli"]
gui_binaries = ["Shellborne"]
gui_allowed_prefixes = ["ghostty_key_encoder_", "ghostty_key_event_"]

# The network scan (P0.9.6). Every Mach-O in the build folder except the update module's binary is read for a
# getaddrinfo symbol and for a link to CFNetwork or the Network framework.
[network]
enforces = "nothing outside the update module resolves names or links a network framework"
update_binaries = ["ShellborneUpdate"]  # exact paths relative to the build folder, never a name found elsewhere
forbidden_symbols = ["getaddrinfo"]
forbidden_frameworks = ["Network.framework", "CFNetwork.framework"]
