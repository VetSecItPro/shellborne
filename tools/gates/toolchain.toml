# The toolchain record: the Ghostty commit, Zig and Xcode, each pinned exactly. The Rust
# pin lives in rust-toolchain.toml at the root. tools/gates/toolchain reads this file and
# compares each pin with the tool a build would use.
# Plan-Step: P0.12.1

[ghostty]
commit = "108cacb17ed8990840cd14abfce43d8ed8503ca1"
reason = "libghostty-vt tag vt-1.0.1, so every build compiles the same terminal parser source"

[zig]
# Taken from minimum_zig_version in build.zig.zon at the pinned Ghostty commit.
version = "0.17.0"

# Where the pinned archives were published, with their hashes below. No build step downloads
# these addresses; they record which release the version and hashes belong to.
[zig.url]
aarch64-macos = "https://ziglang.org/download/0.17.0/zig-aarch64-macos-0.17.0.tar.xz"
x86_64-macos = "https://ziglang.org/download/0.17.0/zig-x86_64-macos-0.17.0.tar.xz"

[zig.sha256]
aarch64-macos = "b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a"
x86_64-macos = "4f9a1c5269aa17ebda5e6d3c2b89d6cbf36f7d2b22a0306e9ab98f25f95529c6"

[xcode]
# Written exactly as the two Xcode tools report them: xcodebuild -version, then
# xcrun --show-sdk-version for the SDK.
version = "26.5"
build = "17F42"
sdk = "26.5"
