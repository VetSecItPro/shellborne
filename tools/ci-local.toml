# Every gate the gates workflow runs, how tools/ci-local calls it, and (through tools/ci-controls/<gate>/good and
# bad) the two cases that show it still tells good input from bad. tools/ci-local refuses to run when the workflow
# calls a gate this file leaves out.

[gates.leak-guard]
args = ["commits", "{repo}", "{range}"]

[gates.secrets]
args = ["commits", "{repo}", "{range}"]

[gates.workflows]
args = ["{repo}"]

[gates.legal-files]
args = ["{repo}"]
copy = ["LICENSE", "NOTICE", "SECURITY.md", "TRADEMARKS.md", "CONTRIBUTING.md"]

[gates.codeowners]
args = ["{repo}", "@VetSecItPro"]
copy = [".github/CODEOWNERS"]

[gates.devlog-check]
args = ["{repo}"]

[gates.unsafe-code]
args = ["--rust", "{repo}"]
copy = ["Cargo.toml", "Cargo.lock", "clippy.toml", "rust-toolchain.toml", "crates/", "apple/"]
timeout = 1800

[gates.who-frees]
args = ["{repo}"]

[gates.build-settings]
args = ["{repo}"]
copy = ["apple/Package.swift"]

[gates.repo-rules]
args = ["{repo}"]

[gates.term-lint]
args = ["{repo}"]
copy = ["docs/intel-support-policy.md"]

[gates.hidden-chars]
args = ["{repo}"]

[gates.copy-lint]
args = ["{repo}"]

[gates.pins]
args = ["{repo}"]

[gates.deny-calls]
args = ["{repo}"]

[gates.bypass-flags]
args = ["{repo}"]

[gates.boundaries]
args = ["{repo}"]
copy = ["Cargo.toml", "Cargo.lock", "clippy.toml", "rust-toolchain.toml", "crates/", "apple/",
        "tools/gates/allowed-deps.toml"]

[gates.dco]
args = ["{repo}", "{range}"]

[gates.plan-step-format]
args = []
body = true

[gates.pr-fields]
args = ["--clone", "{repo}", "--range", "{range}"]
body = true

[gates.test-first]
args = ["{repo}", "{range}"]
body = true
