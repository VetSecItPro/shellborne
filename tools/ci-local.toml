# Every gate the gates workflow runs, how tools/ci-local calls it, and (through tools/ci-controls/<gate>/good and
# bad) the two cases that show it still tells good input from bad. tools/ci-local refuses to run when the workflow
# calls a gate this file leaves out.

[gates.leak-guard]
args = ["commits", "{repo}", "{range}"]

[gates.secrets]
args = ["commits", "{repo}", "{range}"]

[gates.workflows]
args = ["{repo}"]

[gates.legal-files]
args = ["{repo}"]
copy = ["LICENSE", "NOTICE", "SECURITY.md", "TRADEMARKS.md", "CONTRIBUTING.md"]

[gates.codeowners]
args = ["{repo}", "@VetSecItPro"]
copy = [".github/CODEOWNERS"]

[gates.devlog-check]
args = ["{repo}"]

[gates.unsafe-code]
args = ["--rust", "{repo}"]
copy = ["clippy.toml", "rust-toolchain.toml"]
fixture = "rust-workspace"
timeout = 1800

[gates.who-frees]
args = ["{repo}"]

[gates.build-settings]
args = ["{repo}"]
copy = ["apple/Package.swift"]

[gates.repo-rules]
args = ["{repo}"]

[gates.term-lint]
args = ["{repo}"]
copy = ["docs/intel-support-policy.md"]

[gates.hidden-chars]
args = ["{repo}"]

[gates.copy-lint]
args = ["{repo}"]

[gates.pins]
args = ["{repo}"]

[gates.deny-calls]
args = ["{repo}"]

[gates.bypass-flags]
args = ["{repo}"]

[gates.boundaries]
args = ["{repo}"]
copy = ["clippy.toml", "rust-toolchain.toml", "tools/gates/allowed-deps.toml"]
fixture = "rust-workspace"

[gates.dco]
args = ["{repo}", "{range}"]

[gates.plan-step-format]
args = []
body = true

[gates.pr-fields]
args = ["--clone", "{repo}", "--range", "{range}"]
body = true

[gates.test-first]
args = ["{repo}", "{range}"]
body = true

# Executables under tools/gates that ci-local does not run. Each names the workflow that runs it (runs_in, which
# ci-local checks against that workflow's lines outside comments) or says why nothing runs it yet (not_run). ci-local
# refuses an executable there that is neither a gate above nor named here, and any other form of entry.
[others]
bundle-check = { not_run = "judges a built app bundle; pull requests build none yet" }
codeql-results = { runs_in = ".github/workflows/codeql.yml" }
deps = { runs_in = ".github/workflows/macos.yml" }
entitlements = { not_run = "judges a built app's entitlements; pull requests build none yet" }
link-check = { not_run = "judges built binaries' links; pull requests build no binaries yet" }
lipo = { not_run = "judges universal binaries; pull requests build no binaries yet" }
plan-attestation = { runs_in = ".github/workflows/plan-attestation.yml" }
repo-settings = { not_run = "reads the repository's settings from GitHub with a token no workflow is given" }
toolchain = { runs_in = ".github/workflows/macos.yml" }
