# The Rust compiler every build uses, pinned exactly, with both Apple targets so every
# build can be universal. tools/gates/toolchain refuses a floating or missing pin and a
# compiler rustup did not provide.
# Plan-Step: P0.12.1
[toolchain]
channel = "1.99.1"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
