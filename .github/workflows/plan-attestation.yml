# untrusted-trigger: base-only
# The plan attestation: a pull request goes green only when the maintainer's private plan check passed
# on exactly this pull request. pull_request_target runs this file as it is on the base branch, so a pull
# request cannot rewrite the check that judges it. Nothing from the pull request is executed: its head is
# fetched as data, and the verifier and key are taken from the base commit.
# Plan-Step: P0.5.14
name: plan-attestation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: plan-attestation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  attestation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pull request head as data
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --quiet origin "$HEAD_SHA"

      - name: Take the verifier and key from the base commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE:tools/gates/plan-attestation" > "$RUNNER_TEMP/plan-attestation"
          git show "$BASE:.github/plan-attestation.pub" > "$RUNNER_TEMP/plan-attestation.pub"

      - name: Verify the plan attestation
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_REPO: ${{ github.repository }}
        run: python3 "$RUNNER_TEMP/"plan-attestation --key "$RUNNER_TEMP/plan-attestation.pub" .
