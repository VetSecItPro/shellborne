# Public cleanliness gates on every pull request and every push to main: the leak guard, the secrets
# gate and the workflow gate, each over the whole history, with every tool pinned by checksum; the
# legal files and code owners on every run; DCO sign-off on each pull request's own commits.
# Plan-Step: P0.21.3
# Plan-Step: P0.2.4
# Plan-Step: P0.5.9
name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned gitleaks and actionlint
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C "$bin" gitleaks
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o actionlint.tgz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz -C "$bin" actionlint
          echo "$bin" >> "$GITHUB_PATH"

      - name: Leak guard over the whole history
        run: tools/gates/leak-guard commits . HEAD

      - name: Secrets over the whole history
        run: tools/gates/secrets commits . HEAD

      - name: Workflow rules
        run: tools/gates/workflows .

      - name: Legal files
        run: tools/gates/legal-files .

      - name: Code owners
        run: tools/gates/codeowners . @VetSecItPro

      - name: Devlog entries
        run: tools/gates/devlog-check .

      - name: DCO sign-off on the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: tools/gates/dco . "$BASE..$HEAD_SHA"

      - name: Plan-Step lines in the pull request body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: tools/gates/plan-step-format
